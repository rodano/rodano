# App name
spring.application.name=Database initializer
spring.main.web-application-type=NONE

# Do not clean the patch table
rodano.init.clean-patch-table=false
rodano.init.users-password=Password1!

# SQL
spring.sql.init.schema-locations=classpath:database_scripts/structure/tables.sql
spring.sql.init.mode=always
spring.sql.init.encoding=UTF-8
spring.jpa.hibernate.ddl-auto=none
