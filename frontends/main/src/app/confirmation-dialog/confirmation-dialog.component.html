<div class="dialog-container">
	<div class="dialog-header" [class.danger]="data.type === 'danger'" [class.warning]="data.type === 'warning'">
		<mat-icon class="dialog-icon">{{ getIconForType() }}</mat-icon>
		<h2 class="dialog-title">{{ data.title }}</h2>
	</div>

	<div class="dialog-content">
		<p class="dialog-message">{{ data.message }}</p>
	</div>

	<div class="dialog-actions">
		<button class="btn-secondary" (click)="onCancel()">
			{{ data.cancelText }}
		</button>
		<button
			class="btn-danger"
			[class.btn-warning]="data.type === 'warning'"
			(click)="onConfirm()">
			{{ data.confirmText }}
		</button>
	</div>
</div>
