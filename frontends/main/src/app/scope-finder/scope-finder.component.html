<input
	matInput
	type="text"
	#input
	autocomplete="off"
	[matAutocomplete]="autocomplete"
	placeholder="Type to search" />
<mat-autocomplete
	requireSelection
	#autocomplete="matAutocomplete"
	[displayWith]="displayScope"
	(optionSelected)="selectScope($event.option.value)">
	@for (scopeModel of scopeModels; track scopeModel.scopeModelId) {
		@if (getScopes(scopeModel.scopeModelId).length > 0) {
			<mat-optgroup [label]="scopeModel.shortname | localizeMap">
				@for (scope of getScopes(scopeModel.scopeModelId); track scope.pk) {
					<mat-option [value]="scope">
						{{ scope | scopeCodeShortname }}
					</mat-option>
				}
			</mat-optgroup>
		}
	}
</mat-autocomplete>
