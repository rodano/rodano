<div class="title-tabs">
	<h1>
		<button
			mat-icon-button
			inline="true"
			[routerLink]="['/robots']"
			matTooltip="Go back">
			<mat-icon>arrow_back</mat-icon>
		</button>

		@if (robot()) {
			{{ robot().name }}
			<app-audit-trail-button [robot]="robot()" />
		} @else {
			New robot
		}
	</h1>
</div>

@if (robot()) {
	@if (robot().removed) {
		<p class="warning">This robot has been removed.</p>
	}
}

<main>
	<router-outlet></router-outlet>
</main>
