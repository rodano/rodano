<form
	[formGroup]="robotUpdateForm"
	(ngSubmit)="save()"
	class="centered">
	<p class="error">{{ error() }}</p>

	<p>
		<mat-form-field>
			<mat-label>Name</mat-label>
			<input
				matInput
				formControlName="name"
				required />
		</mat-form-field>
		<app-audit-trail-button
			[robot]="robot()"
			property="name" />
	</p>

	<p>
		<mat-form-field>
			<mat-label>Key</mat-label>
			<input
				matInput
				formControlName="key"
				required
				placeholder="Key" />
		</mat-form-field>
	</p>

	<p class="actions">
		<button
			mat-flat-button
			type="submit"
			[disabled]="robotUpdateForm.invalid">
			Save
		</button>
	</p>
</form>
