<div class="preview-root">
	<div class="preview-toolbar">
		<button class="btn-icon-sm" (click)="onClose()" matTooltip="Back to editor">
			<mat-icon>arrow_back</mat-icon>
		</button>
		<span class="toolbar-title">Form Preview</span>
		<span class="toolbar-spacer"></span>
		<button class="btn-toolbar-action"
										[class.active]="applyVisibilityRules"
										(click)="toggleVisibility()"
										[matTooltip]="applyVisibilityRules ? 'Visibility criteria active — click to disable' : 'Visibility criteria disabled — click to enable'">
			<mat-icon>{{ applyVisibilityRules ? 'visibility' : 'visibility_off' }}</mat-icon>
			Visibility {{ applyVisibilityRules ? 'On' : 'Off' }}
		</button>
		<button class="btn-toolbar-action" (click)="resetValues()" matTooltip="Clear all entered values">
			<mat-icon>restart_alt</mat-icon>
			Clear
		</button>
	</div>

	<div class="preview-content">
		<div class="preview-ruler-track">
			<div class="preview-ruler">
				@for (tick of rulerTicks; track tick) {
					<div class="ruler-tick" [style.left.px]="tick">
						<div class="ruler-line"></div>
						<span class="ruler-label">{{ tick === 0 ? '0' : tick + 'px' }}</span>
					</div>
				}
			</div>
		</div>

		@if (layouts.length === 0) {
			<div class="preview-empty">
				<mat-icon>view_quilt</mat-icon>
				<p>No layouts to preview.</p>
			</div>
		}

		@if (!rebuilding) {
			<div class="preview-layouts-area" [style.width]="getLayoutWidth()">
				@for (layout of layouts; track layout.formLayoutId) {
					@if (layout.type === layoutType.SINGLE) {
						<app-layout
							[layout]="layout"
							[datasets]="datasets"
							[layoutUid]="layout.formLayoutId"
							[disabled]="false">
						</app-layout>
					} @else {
						<div [style.width]="getLayoutWidth()">
							<app-preview-multiple-layout
								[layout]="layout"
								[datasets]="datasets"
								[disabled]="false">
							</app-preview-multiple-layout>
						</div>
					}
				}
			</div>
		}
	</div>
</div>
