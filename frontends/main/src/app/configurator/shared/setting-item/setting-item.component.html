<div class="setting-item"
					[class.modified]="modified"
					[class.full-width]="fullWidth">
	<label>
		{{ label }}
		@if (translated) {
			<mat-icon class="translated-icon" matTooltip="Translatable field">language</mat-icon>
		}
		@if (modified) {
			<mat-icon class="modified-icon" matTooltip="Modified">edit</mat-icon>
		}
	</label>
	<div [class.setting-value]="!plain" [class.not-configured]="notConfigured && !plain">
		<ng-content />
	</div>
</div>
