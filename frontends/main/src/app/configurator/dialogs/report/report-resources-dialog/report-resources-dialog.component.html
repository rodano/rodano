<h2 class="dialog-title">Edit Resources</h2>

<div class="dialog-content">
	<app-dual-list-box
		title="Field Models"
		hint="Select which field models should be associated with this report"
		[available]="availableFieldModels"
		[selected]="selectedFieldModels"
		[labelFn]="languageService.getLabel.bind(languageService)"
		availablePlaceholder="No available field models"
		selectedPlaceholder="No field models selected"
		(add)="onAddFieldModel($event)"
		(remove)="onRemoveFieldModel($event)">
	</app-dual-list-box>
</div>

<div class="dialog-actions">
	<button class="btn-secondary" (click)="onCancel()">
		Cancel
	</button>
	<button class="btn-primary" (click)="onSave()">
		<mat-icon>save</mat-icon>
		Save Changes
	</button>
</div>
