<div class="dialog-container">
	<h2 class="dialog-title">Edit Relationships</h2>

	<div class="dialog-content">
		<form [formGroup]="form" class="settings-form">

			<app-dual-list-box
				title="Parent Scope Models"
				hint="Click a model to move it between lists."
				[available]="availableParents"
				[selected]="selectedParents"
				[labelFn]="languageService.getLabel.bind(languageService)"
				availablePlaceholder="No available models"
				selectedPlaceholder="Root Level (None)"
				(add)="onAddParent($event)"
				(remove)="onRemoveParent($event)">
			</app-dual-list-box>

			<div class="form-field">
				<label>Default Parent</label>
				<mat-select formControlName="defaultParentId" placeholder="Select default parent">
					<mat-option [value]="''">-- None --</mat-option>
					@for (parent of selectedParents; track parent.scopeModelId) {
						<mat-option [value]="parent.scopeModelId">
							{{ languageService.getLabel(parent) }}
						</mat-option>
					}
				</mat-select>
				<span class="hint">The parent used by default for new instances.</span>
			</div>

		</form>
	</div>

	<div class="dialog-actions">
		<button class="btn-secondary" (click)="onCancel()">Cancel</button>
		<button class="btn-primary" (click)="onSave()" [disabled]="form.invalid">
			Save Changes
		</button>
	</div>
</div>
