<div class="dialog-container">
	<h2 class="dialog-title">Edit Default Settings</h2>

	<div class="dialog-content">
		<form [formGroup]="form" class="settings-form">
			<div class="form-field">
				<label>Default Profile</label>
				<mat-select formControlName="defaultProfileId" placeholder="Select profile">
					<mat-option [value]="null">None</mat-option>
					@for (profile of availableProfiles; track profile.profileId) {
						<mat-option [value]="profile.profileId">
							{{ languageService.getLabel(profile) }}
						</mat-option>
					}
				</mat-select>
				<span class="hint">The default profile for users in this scope (optional)</span>
			</div>
		</form>
	</div>

	<div class="dialog-actions">
		<button class="btn-secondary" (click)="onCancel()" [disabled]="saving">
			Cancel
		</button>
		<button class="btn-primary" (click)="onSave()" [disabled]="saving || form.invalid">
			Save Changes
		</button>
	</div>
</div>
