<h2 class="dialog-title">Edit Workflows</h2>

<div class="dialog-content">
	<app-dual-list-box
		title="Workflows"
		hint="Select which workflows should be associated with this workflow summary"
		[available]="availableWorkflows"
		[selected]="selectedWorkflows"
		[labelFn]="languageService.getLabel.bind(languageService)"
		availablePlaceholder="No available workflows"
		selectedPlaceholder="No workflows selected"
		(add)="onAddWorkflow($event)"
		(remove)="onRemoveWorkflow($event)">
	</app-dual-list-box>
</div>

<div class="dialog-actions">
	<button class="btn-secondary" (click)="onCancel()">
		Cancel
	</button>
	<button class="btn-primary" (click)="onSave()">
		<mat-icon>save</mat-icon>
		Save Changes
	</button>
</div>
