<div class="dialog-container">
	<h2 class="dialog-title">Edit Export and Use Settings</h2>

	<div class="dialog-content">
		<form [formGroup]="form" class="settings-form">
			<div class="form-field">
				<mat-checkbox formControlName="exportable">Exportable</mat-checkbox>
				<span class="hint">Include this field in data exports</span>
			</div>

			<div class="form-field">
				<label>Export Order</label>
				<input type="number" formControlName="exportOrder" placeholder="10" min="0">
				<span class="hint">Order in which this field appears in exports (lower numbers first)</span>
			</div>

			<div class="form-field">
				<mat-checkbox formControlName="searchable">Searchable</mat-checkbox>
				<span class="hint">Can this field be searched</span>
			</div>
		</form>
	</div>

	<div class="dialog-actions">
		<button class="btn-secondary" (click)="onCancel()">
			Cancel
		</button>
		<button class="btn-primary" (click)="onSave()">
			Save Changes
		</button>
	</div>
</div>
