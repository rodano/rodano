<h2 class="dialog-title">Edit Resources</h2>

<div class="dialog-content">
	<app-dual-list-box
		title="Profiles"
		hint="Select which profiles should be associated with this privacy policy"
		[available]="availableProfiles"
		[selected]="selectedProfiles"
		[labelFn]="languageService.getLabel.bind(languageService)"
		availablePlaceholder="No available profiles"
		selectedPlaceholder="No profiles selected"
		(add)="onAddProfile($event)"
		(remove)="onRemoveProfile($event)">
	</app-dual-list-box>
</div>

<div class="dialog-actions">
	<button class="btn-secondary" (click)="onCancel()">
		Cancel
	</button>
	<button class="btn-primary" (click)="onSave()">
		<mat-icon>save</mat-icon>
		Save Changes
	</button>
</div>
