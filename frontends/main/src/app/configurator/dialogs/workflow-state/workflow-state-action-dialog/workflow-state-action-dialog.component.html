<h2 class="dialog-title">Edit Possible Actions</h2>

<div class="dialog-content">
	<app-dual-list-box
		title="Possible Actions"
		hint="Select which workflow actions are possible from this state"
		[available]="availableWorkflowActions"
		[selected]="selectedWorkflowActions"
		[labelFn]="languageService.getLabel.bind(languageService)"
		availablePlaceholder="No available workflow actions"
		selectedPlaceholder="No workflow actions selected"
		(add)="onAdd($event)"
		(remove)="onRemove($event)">
	</app-dual-list-box>
</div>

<div class="dialog-actions">
	<button class="btn-secondary" (click)="onCancel()">Cancel</button>
	<button class="btn-primary" (click)="onSave()">
		<mat-icon>save</mat-icon>
		Save Changes
	</button>
</div>
