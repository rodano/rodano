<div class="dialog-container">
	<h2 class="dialog-title">Edit Introduction Text</h2>

	<div class="dialog-content">
		<app-wysiwyg-editor
			[formControl]="introductionTextControl"
			placeholder="Enter introduction text...">
		</app-wysiwyg-editor>
		<span class="hint">Use the toolbar to format the text. Leave empty to clear.</span>
	</div>

	<div class="dialog-actions">
		<button class="btn-secondary" (click)="onCancel()">Cancel</button>
		<button class="btn-primary" (click)="onSave()">Save Changes</button>
	</div>
</div>
