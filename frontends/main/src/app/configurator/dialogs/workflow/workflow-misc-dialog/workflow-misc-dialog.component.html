<div class="dialog-container">
	<h2 class="dialog-title">Edit Message & Icon</h2>

	<div class="dialog-content">
		<form [formGroup]="form" class="settings-form">

			<div class="form-field">
				<label>Icon</label>
				<div class="icon-input-row">
					<input type="text" formControlName="icon" placeholder='e.g., "person", "medical_services"'>
					@if (iconPreview) {
						<mat-icon class="icon-preview">{{ iconPreview }}</mat-icon>
					}
				</div>
				<span class="hint">Browse icons at <a href="https://fonts.google.com/icons" target="_blank">Material Icons</a></span>
			</div>

			<div class="form-section">
				<h3>Message</h3>
				<mat-tab-group>
					@for (lang of availableLanguages; track lang.languageCode) {
						@if (lang.languageCode) {
							<mat-tab [label]="getLanguageLabel(lang.languageCode, lang.isDefault ?? false)">
								<div class="tab-content" [formGroup]="languageForms.get(lang.languageCode)!">
									<div class="form-field">
										<label>Message</label>
										<textarea
											formControlName="message"
											placeholder="Enter message"
											rows="3"></textarea>
									</div>
								</div>
							</mat-tab>
						}
					}
				</mat-tab-group>
			</div>
		</form>
	</div>

	<div class="dialog-actions">
		<button class="btn-secondary" (click)="onCancel()">Cancel</button>
		<button class="btn-primary" (click)="onSave()">Save Changes</button>
	</div>
</div>
