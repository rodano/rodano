<h2 class="dialog-title">Edit Workflow Configuration</h2>

<div class="dialog-content">
	<div class="form-section">
		<div class="form-field">
			<label>Workflow</label>
			<mat-select [(ngModel)]="selectedWorkflowId" (ngModelChange)="onWorkflowSelected($event)" placeholder="Select workflow">
				<mat-option [value]="null">None</mat-option>
				@for (wf of data.availableWorkflows; track wf.id) {
					<mat-option [value]="wf.id">{{ wf.name }}</mat-option>
				}
			</mat-select>
		</div>

		@if (selectedWorkflowId) {
			<div class="form-field">
				<label>Invalid State</label>
				<mat-select [(ngModel)]="selectedInvalidStateId" placeholder="Select invalid state">
					<mat-option [value]="null">None</mat-option>
					@for (state of availableStates; track state.id) {
						<mat-option [value]="state.id">{{ state.name }}</mat-option>
					}
				</mat-select>
			</div>

			<div class="form-field">
				<label>Valid State</label>
				<mat-select [(ngModel)]="selectedValidStateId" placeholder="Select valid state">
					<mat-option [value]="null">None</mat-option>
					@for (state of availableStates; track state.id) {
						<mat-option [value]="state.id">{{ state.name }}</mat-option>
					}
				</mat-select>
			</div>
		}
	</div>
</div>

<div class="dialog-actions">
	<button class="btn-secondary" (click)="onCancel()">
		Cancel
	</button>
	<button class="btn-primary" (click)="onSave()">
		<mat-icon>save</mat-icon>
		Save Changes
	</button>
</div>
