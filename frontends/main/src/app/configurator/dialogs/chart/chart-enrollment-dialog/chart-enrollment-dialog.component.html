<div class="dialog-container">
	<h2 class="dialog-title">Enrollment Settings</h2>

	<div class="dialog-content">
		<form [formGroup]="form" class="settings-form">
			<div class="form-field checkbox-field">
				<mat-checkbox formControlName="displayExpected">Display Expected</mat-checkbox>
				<span class="hint">Show expected enrollment line on the chart</span>
			</div>

			<div class="form-field">
				<label>Enrollment Workflow</label>
				<mat-select formControlName="workflowId" placeholder="Select a workflow">
					<mat-option [value]="null">None</mat-option>
					@for (wf of data.availableWorkflows; track wf.workflowId) {
						<mat-option [value]="wf.workflowId">
							{{ languageService.getLabel(wf) }}
						</mat-option>
					}
				</mat-select>
				<span class="hint">Optional workflow used to track enrollment</span>
			</div>
		</form>
	</div>

	<div class="dialog-actions">
		<button class="btn-secondary" (click)="onCancel()">Cancel</button>
		<button class="btn-primary" (click)="onSave()">Save Changes</button>
	</div>
</div>
