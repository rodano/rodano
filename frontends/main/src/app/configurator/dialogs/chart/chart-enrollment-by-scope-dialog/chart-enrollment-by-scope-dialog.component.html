<div class="dialog-container">
	<h2 class="dialog-title">Enrollment by Scope Settings</h2>

	<div class="dialog-content">
		<form [formGroup]="form" class="settings-form">
			<div class="form-field">
				<label>Scope Model</label>
				<mat-select formControlName="scopeModelId" placeholder="Select a scope model">
					<mat-option [value]="null">-- None --</mat-option>
					@for (sm of data.availableScopeModels; track sm.scopeModelId) {
						<mat-option [value]="sm.scopeModelId">
							{{ languageService.getLabel(sm) }}
						</mat-option>
					}
				</mat-select>
				<span class="hint">The scope model to group enrollment data by</span>
			</div>
		</form>
	</div>

	<div class="dialog-actions">
		<button class="btn-secondary" (click)="onCancel()">Cancel</button>
		<button class="btn-primary" (click)="onSave()">Save Changes</button>
	</div>
</div>
