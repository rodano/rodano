<div class="dialog-container">
	<h2 class="dialog-title">Workflow Status Settings</h2>

	<div class="dialog-content">
		<form [formGroup]="form" class="settings-form">
			<div class="form-field">
				<label>Workflow</label>
				<mat-select formControlName="workflowId" placeholder="Select a workflow">
					<mat-option [value]="null">None</mat-option>
					@for (wf of data.availableWorkflows; track wf.workflowId) {
						<mat-option [value]="wf.workflowId">
							{{ languageService.getLabel(wf) }}
						</mat-option>
					}
				</mat-select>
			</div>
		</form>

		@if (form.value.workflowId) {
			<app-dual-list-box
				title="Included States"
				hint="Select which workflow states are included in this chart"
				[available]="includedAvailable"
				[selected]="includedSelected"
				[labelFn]="languageService.getLabel.bind(languageService)"
				availablePlaceholder="No available workflow states"
				selectedPlaceholder="No workflow states selected"
				(add)="addIncluded($event)"
				(remove)="removeIncluded($event)">
			</app-dual-list-box>

			<app-dual-list-box
				title="Excluded States"
				hint="Select which workflow states are excluded from this chart"
				[available]="excludedAvailable"
				[selected]="excludedSelected"
				[labelFn]="languageService.getLabel.bind(languageService)"
				availablePlaceholder="No available workflow states"
				selectedPlaceholder="No workflow states selected"
				(add)="addExcluded($event)"
				(remove)="removeExcluded($event)">
			</app-dual-list-box>
		}
	</div>

	<div class="dialog-actions">
		<button class="btn-secondary" (click)="onCancel()">Cancel</button>
		<button class="btn-primary" (click)="onSave()">Save Changes</button>
	</div>
</div>
