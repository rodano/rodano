<h2 class="dialog-title">Edit Associated Resources</h2>

<div class="dialog-content">
	<app-dual-list-box
		title="Form Models"
		hint="Select which forms should be associated with this event"
		[available]="availableFormModels"
		[selected]="selectedFormModels"
		[labelFn]="languageService.getLabel.bind(languageService)"
		availablePlaceholder="No available form models"
		selectedPlaceholder="No form models selected"
		(add)="addFormModel($event)"
		(remove)="removeFormModel($event)">
	</app-dual-list-box>

	<app-dual-list-box
		title="Dataset Models"
		hint="Select which datasets should be associated with this event"
		[available]="availableDatasetModels"
		[selected]="selectedDatasetModels"
		[labelFn]="languageService.getLabel.bind(languageService)"
		availablePlaceholder="No available dataset models"
		selectedPlaceholder="No dataset models selected"
		(add)="addDatasetModel($event)"
		(remove)="removeDatasetModel($event)">
	</app-dual-list-box>

	<app-dual-list-box
		title="Workflows"
		hint="Select which workflows should be associated with this event"
		[available]="availableWorkflows"
		[selected]="selectedWorkflows"
		[labelFn]="languageService.getLabel.bind(languageService)"
		availablePlaceholder="No available workflows"
		selectedPlaceholder="No workflows selected"
		(add)="addWorkflow($event)"
		(remove)="removeWorkflow($event)">
	</app-dual-list-box>
</div>

<div class="dialog-actions">
	<button class="btn-secondary" (click)="onCancel()">
		Cancel
	</button>
	<button class="btn-primary" (click)="onSave()">
		<mat-icon>save</mat-icon>
		Save Changes
	</button>
</div>
