<h2 class="dialog-title">Edit Event Relationships</h2>

<div class="dialog-content">
	<app-dual-list-box
		title="Blocked Event Models"
		hint="Event models that cannot be created when this event exists"
		[available]="availableBlockedEventModels"
		[selected]="selectedBlockedEventModels"
		[labelFn]="languageService.getLabel.bind(languageService)"
		availablePlaceholder="No available event models"
		selectedPlaceholder="No event models selected"
		(add)="addBlockedEventModel($event)"
		(remove)="removeBlockedEventModel($event)">
	</app-dual-list-box>

	<app-dual-list-box
		title="Implied Event Models"
		hint="Event models that must be created when this event is created"
		[available]="availableImpliedEventModels"
		[selected]="selectedImpliedEventModels"
		[labelFn]="languageService.getLabel.bind(languageService)"
		availablePlaceholder="No available event models"
		selectedPlaceholder="No event models selected"
		(add)="addImpliedEventModel($event)"
		(remove)="removeImpliedEventModel($event)">
	</app-dual-list-box>
</div>

<div class="dialog-actions">
	<button class="btn-secondary" (click)="onCancel()">
		Cancel
	</button>
	<button class="btn-primary" (click)="onSave()">
		<mat-icon>save</mat-icon>
		Save Changes
	</button>
</div>
