<div class="tree-node">
	<div
		class="node-content clickable"
		[class.selected]="expanded"
		(click)="onCategoryClick()">
		<mat-icon class="node-icon">stars</mat-icon>
		<span class="node-label">Features</span>
	</div>

	@if (expanded && treeNodes.length > 0) {
		<div class="node-children">
			@for (node of treeNodes; track node.id) {
				<ng-container *ngTemplateOutlet="nodeTemplate; context: {$implicit: node}"></ng-container>
			}
		</div>
	}
</div>

<ng-template #nodeTemplate let-node>
	<div
		class="node"
		[class.selected]="node.selected">
		<mat-icon class="node-icon">{{ node.icon }}</mat-icon>
		<span class="node-label">{{ node.label }}</span>
	</div>
</ng-template>
