@if (study) {
	@if (study && showLayout && study.environment !== environment.PROD) {
		<div id="stamp">{{ study.environment }}</div>
	}
	@if (showLayout && study) {
		<header>
			<app-header [study]="study"></app-header>
		</header>
	}
}

<!--content must be displayed even if the study cannot be fetched, to display the error page-->
@if (displayContent) {
	<!--this div container is required as router-outlet cannot be a container, because the content is appended after the router-outlet, not inside-->
	<div id="content">
		<router-outlet></router-outlet>
	</div>
	@if (showLayout) {
		<footer>
			Powered by <a href="https://www.rodano.ch">Rodano</a>. Distributed under AGPLv3. Access source code
			<a href="https://github.com/rodano/rodano">here</a>.
		</footer>
	}
}
