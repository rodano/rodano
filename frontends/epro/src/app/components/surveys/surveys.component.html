<mat-toolbar class="page-toolbar">
	<span class="toolbar-title">Surveys</span>
	<span class="toolbar-spacer"></span>
	<button
		mat-icon-button
		type="button"
		aria-label="Refresh"
		[disabled]="loading()"
		(click)="refresh()">
		<mat-icon>refresh</mat-icon>
	</button>
</mat-toolbar>
@if (loading()) {
	<mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<div class="content">
	@if (events(); as events) {
		@if (events.length === 0) {
			<h1 class="empty">No surveys found</h1>
		} @else {
			@for (event of events; track event.pk) {
				<app-event-card
					[scope]="scope()!"
					[event]="event"
					(deleted)="onDelete($event)">
				</app-event-card>
			}
		}
	}
</div>
