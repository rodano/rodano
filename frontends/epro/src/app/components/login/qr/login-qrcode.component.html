<mat-toolbar class="page-toolbar">
	<button
		mat-icon-button
		type="button"
		aria-label="Back"
		(click)="back()">
		<mat-icon>arrow_back</mat-icon>
	</button>
	<span class="toolbar-title">Scan QR code</span>
</mat-toolbar>
@if (loading()) {
	<mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<div class="content">
	<video #video></video>
</div>
