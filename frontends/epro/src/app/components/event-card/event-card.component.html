<mat-card appearance="outlined">
	<mat-card-header>
		<mat-card-title>
			{{ event().shortname }}
			@if (locked()) {
				<mat-icon>lock</mat-icon>
			}
		</mat-card-title>
		<mat-card-subtitle>
			{{ getReadableDate() }}
		</mat-card-subtitle>
	</mat-card-header>

	<mat-card-content>
		<mat-action-list>
			@for (dataset of datasets(); track dataset.pk) {
				<button
					mat-list-item
					type="button"
					[disabled]="locked()"
					(click)="onSelect(dataset)">
					@if (locked()) {
						<mat-icon matListItemIcon>lock</mat-icon>
					} @else if (!datasetStateService.isStarted(dataset)) {
						<mat-icon matListItemIcon>radio_button_unchecked</mat-icon>
					} @else if (!datasetStateService.isCompleted(dataset)) {
						<mat-icon
							matListItemIcon
							class="started">
							warning
						</mat-icon>
					} @else {
						<mat-icon
							matListItemIcon
							class="completed">
							check_circle
						</mat-icon>
					}

					<span matListItemTitle>{{ dataset.model.shortname | localizer }}</span>
					<span matListItemLine>{{ dataset.model.fieldModels.length }} questions</span>
				</button>
			}
		</mat-action-list>
	</mat-card-content>

	@if (removable()) {
		<mat-card-actions align="end">
			<button
				mat-stroked-button
				type="button"
				class="remove"
				(click)="onDelete()">
				Remove
			</button>
		</mat-card-actions>
	}
</mat-card>
