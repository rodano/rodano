<mat-toolbar class="page-toolbar">
	<span class="toolbar-title">Journal</span>
	<span class="toolbar-spacer"></span>
	<button
		mat-icon-button
		type="button"
		aria-label="Refresh"
		[disabled]="loading()"
		(click)="refresh()">
		<mat-icon>refresh</mat-icon>
	</button>
</mat-toolbar>
@if (loading()) {
	<mat-progress-bar mode="indeterminate"></mat-progress-bar>
}

<div class="content">
	@if (events(); as events) {
		@if (events.length === 0) {
			<h1 class="empty">No events yet</h1>
		} @else {
			@for (event of events; track event.pk) {
				<app-event-card
					[scope]="scope()!"
					[event]="event"
					(deleted)="onDelete($event)">
				</app-event-card>
			}
		}
	}
</div>

@if (availableEventModels().length > 0) {
	<button
		mat-fab
		type="button"
		class="new-event"
		aria-label="Create an event"
		[matMenuTriggerFor]="eventModelsMenu">
		<mat-icon>add</mat-icon>
	</button>
	<mat-menu #eventModelsMenu="matMenu">
		@for (eventModel of availableEventModels(); track eventModel.id) {
			<button
				mat-menu-item
				type="button"
				(click)="createEvent(eventModel)">
				<mat-icon>{{ eventModel.icon }}</mat-icon>
				<span>{{ eventModel.shortname | localizer }}</span>
			</button>
		}
	</mat-menu>
}
