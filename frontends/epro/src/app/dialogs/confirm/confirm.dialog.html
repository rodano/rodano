<h1 mat-dialog-title>{{ data.title }}</h1>

<mat-dialog-content>
	<p>{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions>
	<button
		mat-stroked-button
		[mat-dialog-close]="false">
		{{ data.dismissLabel ?? (data.confirmLabel ? 'Cancel' : 'OK') }}
	</button>
	@if (data.confirmLabel) {
		<button
			mat-flat-button
			[mat-dialog-close]="true">
			{{ data.confirmLabel }}
		</button>
	}
</mat-dialog-actions>
