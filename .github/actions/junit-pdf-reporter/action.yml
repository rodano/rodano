name: JUnit PDF reporter
description: Render test-output/results.xml as test-output/results.pdf
inputs:
  working-directory:
    description: Component directory, relative to the repository workspace
    required: true
runs:
  using: composite
  steps:
    - name: Install reporter dependencies and browser
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci
    - name: Generate PDF
      shell: bash
      working-directory: ${{ github.workspace }}/${{ inputs.working-directory }}
      env:
        ACTION_PATH: ${{ github.action_path }}
      run: node "$ACTION_PATH/index.js" test-output/results.xml test-output/results.pdf
